    <!-- MODAL PARA VISUALIZAR LAS IMÁGENES -->
    <div class="modal fade" id="modalImagen" tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content">

                <!-- ENCABEZADO DEL MODAL -->
                <div class="modal-header">

                    <h5 class="modal-title">
                        Visualizar fotografía
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>


                <!-- CUERPO DEL MODAL -->
                <div class="modal-body text-center">

                    <img
                        src=""
                        id="imagenGrande"
                        alt="Fotografía ampliada"
                    >

                </div>


                <!-- PIE DEL MODAL -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cerrar

                    </button>

                </div>

            </div>

        </div>

    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- JAVASCRIPT PARA ABRIR LAS IMÁGENES -->
    <script>

        // Seleccionar todas las imágenes de las tarjetas
        const imagenes = document.querySelectorAll('.card-img-top');

        // Obtener la imagen que aparecerá dentro del modal
        const imagenGrande = document.getElementById('imagenGrande');

        // Obtener el modal
        const elementoModal = document.getElementById('modalImagen');

        // Crear el objeto modal de Bootstrap
        const modal = new bootstrap.Modal(elementoModal);


        // Recorrer todas las imágenes
        imagenes.forEach(function(imagen) {

            // Detectar cuando se hace clic en una imagen
            imagen.addEventListener('click', function() {

                // Obtener la ruta de la imagen seleccionada
                let rutaImagen = this.src;

                // Asignar la ruta a la imagen grande
                imagenGrande.src = rutaImagen;

                // Mostrar el modal
                modal.show();

            });

        });


        // Limpiar la imagen cuando se cierre el modal
        elementoModal.addEventListener('hidden.bs.modal', function() {

            imagenGrande.src = "";

        });

    </script>
